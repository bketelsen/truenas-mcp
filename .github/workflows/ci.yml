name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue requests the required checks on its own
  # `gh-readonly-queue/*` branches; without this trigger those contexts never
  # report and every queue entry waits out the check timeout.
  merge_group:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # mise.toml and mise.lock are the single source of every tool pin: this
      # installs exactly the locked golangci-lint, checksum-verified, the same
      # way a developer's `mise install` does, so the two cannot drift. Go
      # still comes from actions/setup-go above (go.mod's go line).
      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          install_args: golangci-lint
          cache: true

      # Same config and pin guard as `make lint`: the job runs the target, so a
      # check added to the Makefile runs here without a second edit.
      - name: Lint
        run: make lint

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The corrections check compares .memory/corrections.jsonl with the PR
          # base, so the base commit must be in the clone.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `make verify` runs the template gate (ADR-0003), which needs Node, and
      # the pinned golangci-lint; both are pinned in mise.toml/mise.lock, the
      # same way the lint job installs its copy.
      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          install_args: node golangci-lint
          cache: true

      # The same target a developer runs: tidy diff, vet, gofmt and its
      # self-test, the pinned golangci-lint, the template gate and its tests.
      - name: Verify
        run: make verify

      - name: Check corrections are append-only against the PR base
        run: |
          if [ -n "$BASE" ]; then node scripts/check-corrections.mjs --base "$BASE"; fi
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build
          ls -lh build/

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HAS_GORELEASER_KEY: ${{ secrets.GORELEASER_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate GoReleaser Pro configuration
        if: env.HAS_GORELEASER_KEY == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: check

      - name: Fail when trusted runs cannot validate the release configuration
        if: env.HAS_GORELEASER_KEY != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          echo "::error::GORELEASER_KEY is unavailable; the GoReleaser Pro configuration was not validated."
          exit 1

      - name: Report unvalidated fork pull request
        if: env.HAS_GORELEASER_KEY != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::warning::GoReleaser Pro configuration was not validated because secrets are unavailable to fork pull requests."
          echo "### Release configuration not validated" >> "$GITHUB_STEP_SUMMARY"
          echo "GORELEASER_KEY is unavailable to this fork pull request; a trusted merge-queue run must validate .goreleaser.yaml before merge." >> "$GITHUB_STEP_SUMMARY"
