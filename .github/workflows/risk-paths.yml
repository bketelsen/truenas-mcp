# PR triage (ADR-0068, ADR-0077, ADR-0078, docs/specs/risk-paths.md): this
# caller runs on pull_request_target so the base risk list and trusted caller
# execute. It does not run a PR branch. It checks out nothing. It is not a
# required check. It adds the level label level:L1 to level:L4 and, for L1 and
# L2, the label risk:high. It removes ready-for-human when the head moves after
# the label, or when CI is not green when the label comes. The repository must
# have the risk:high label, or the levels step fails.
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@981e7aeb014cbd3efee710e99a5043fcc4763446 # frostyard/core main, 2026-11-14 (core#246; core has no release tags)
